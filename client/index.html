<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>NYC School Ratings - Find and Compare NYC Elementary Schools</title>
    <meta name="description" content="Find and compare NYC public and charter elementary schools with ratings and detailed metrics. Search by district, view test scores, climate ratings, and make informed school decisions." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nycschoolsratings.com/" />
    <meta property="og:title" content="NYC School Ratings - Find and Compare NYC Elementary Schools" />
    <meta property="og:description" content="Find and compare NYC public and charter elementary schools with ratings and detailed metrics. Search by district, view test scores, climate ratings, and make informed school decisions." />
    <meta property="og:image" content="https://nycschoolsratings.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://nycschoolsratings.com/" />
    <meta property="twitter:title" content="NYC School Ratings - Find and Compare NYC Elementary Schools" />
    <meta property="twitter:description" content="Find and compare NYC public and charter elementary schools with ratings and detailed metrics. Search by district, view test scores, climate ratings, and make informed school decisions." />
    <meta property="twitter:image" content="https://nycschoolsratings.com/og-image.jpg" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <!-- Preconnect to font CDN (improves LCP for text-based hero) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Inter font: load NON-render-blocking via the preload-as-style swap
         pattern. The CSS request is fetched in parallel with HTML parsing,
         and the onload swap promotes it to a stylesheet without blocking
         first paint. font-display=swap means LCP text paints immediately
         in the system fallback and upgrades to Inter once it arrives. The
         <noscript> fallback ensures users with JS disabled still get Inter. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google Analytics 4 - Loaded inside requestIdleCallback so it never
         competes with LCP or steals main-thread time during interaction.
         Events fired before the script loads queue in dataLayer and replay
         on init. Falls back to a 3s setTimeout on browsers (Safari) that
         lack requestIdleCallback. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CFQMFS3K1N');
      var __loadGa = function() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-CFQMFS3K1N';
        document.head.appendChild(s);
      };
      if ('requestIdleCallback' in window) {
        requestIdleCallback(__loadGa, { timeout: 4000 });
      } else {
        setTimeout(__loadGa, 3000);
      }
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>NYC School Ratings - Find and Compare NYC Elementary Schools</title>
    <meta name="description" content="Find and compare NYC public and charter elementary schools with ratings and detailed metrics. Search by district, view test scores, climate ratings, and make informed school decisions." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nycschoolsratings.com/" />
    <meta property="og:title" content="NYC School Ratings - Find and Compare NYC Elementary Schools" />
    <meta property="og:description" content="Find and compare NYC public and charter elementary schools with ratings and detailed metrics. Search by district, view test scores, climate ratings, and make informed school decisions." />
    <meta property="og:image" content="https://nycschoolsratings.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://nycschoolsratings.com/" />
    <meta property="twitter:title" content="NYC School Ratings - Find and Compare NYC Elementary Schools" />
    <meta property="twitter:description" content="Find and compare NYC public and charter elementary schools with ratings and detailed metrics. Search by district, view test scores, climate ratings, and make informed school decisions." />
    <meta property="twitter:image" content="https://nycschoolsratings.com/og-image.jpg" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <!-- Preconnect to font CDN (improves LCP for text-based hero) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Trim font weights to only those actually used (400/500/600/700) and
         load synchronously with display=swap so the LCP text paints in fallback
         font immediately, then upgrades when Inter arrives. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google Analytics 4 - Fully deferred so neither the loader nor the
         init code blocks parsing or competes with the LCP paint. -->
    <script defer src="https://www.googletagmanager.com/gtag/js?id=G-CFQMFS3K1N"></script>
    <script defer>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CFQMFS3K1N');
    </script>
  </body>
</html>

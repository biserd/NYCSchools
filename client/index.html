<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- No-JS readers see the complete SEO content. JS visitors see a stable,
         styled header while the interactive app replaces that content. -->
    <style>
      [data-boot-header] { display: none; }
      html.js-app #root[data-server-rendered="true"]:not([data-hydrate="true"]) > * { display: none; }
      html.js-app #root[data-server-rendered="true"]:not([data-hydrate="true"]) > [data-boot-header] {
        display: block;
        box-sizing: border-box;
        padding: 16px;
        border-bottom: 1px solid #e5e7eb;
        background: #fff;
        color: #171717;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      [data-boot-header] .boot-brand { display: block; color: #1265c7; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .025em; text-transform: uppercase; }
      [data-boot-header] .boot-title { margin: 0; font-size: 20px; line-height: 28px; font-weight: 700; }
      [data-boot-header] .boot-description { display: none; margin: 0; color: #596579; font-size: 14px; line-height: 20px; }
      @media (min-width: 640px) { [data-boot-header] .boot-description { display: block; } }
      @media (min-width: 768px) {
        html.js-app #root[data-server-rendered="true"]:not([data-hydrate="true"]) > [data-boot-header] { padding: 24px 32px; }
        [data-boot-header] .boot-title { font-size: 30px; line-height: 36px; }
      }
    </style>
    <script>
      document.documentElement.classList.add('js-app');
      // If the app bundle fails to load, show the useful server content again.
      setTimeout(function () {
        if (document.querySelector('#root[data-server-rendered="true"]:not([data-hydrate="true"])')) {
          document.documentElement.classList.remove('js-app');
        }
      }, 10000);
    </script>
    <title>NYC School Ratings &amp; Rankings | Compare 2,100+ Schools</title>
    <meta name="description" content="Compare 2,100+ NYC public, charter, private, and early-childhood schools using ratings, admissions context, programs, demographics, and parent reviews." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nycschoolsratings.com/" />
    <meta property="og:title" content="NYC School Ratings &amp; Rankings | Compare 2,100+ Schools" />
    <meta property="og:description" content="Compare 2,100+ NYC public, charter, private, and early-childhood schools using ratings, admissions context, programs, demographics, and parent reviews." />
    <meta property="og:image" content="https://nycschoolsratings.com/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://nycschoolsratings.com/" />
    <meta name="twitter:title" content="NYC School Ratings &amp; Rankings | Compare 2,100+ Schools" />
    <meta name="twitter:description" content="Compare 2,100+ NYC public, charter, private, and early-childhood schools using ratings, admissions context, programs, demographics, and parent reviews." />
    <meta name="twitter:image" content="https://nycschoolsratings.com/og-image.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <!-- Use the native system font stack. A late web-font swap changed text
         widths after first paint and was a measurable source of desktop CLS. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- GA4: load via requestIdleCallback so it doesn't compete with LCP. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CFQMFS3K1N', { send_page_view: false });
      var __loadGa = function() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-CFQMFS3K1N';
        document.head.appendChild(s);
      };
      if ('requestIdleCallback' in window) {
        requestIdleCallback(__loadGa, { timeout: 4000 });
      } else {
        setTimeout(__loadGa, 3000);
      }
    </script>
  </body>
</html>
